<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - СЕС</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card p-4 shadow">
            <h3 class="mb-3">Реєстрація</h3>
            <form id="regForm">
                <input type="text" id="name" class="form-control mb-2" placeholder="Ім'я" required>
                <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
                <input type="password" id="password" class="form-control mb-2" placeholder="Пароль (мін. 10 симв.)" required>
                <select id="role" class="form-select mb-3">
                    <option value="engineer">Інженер</option>
                    <option value="admin">Адміністратор</option>
                </select>
                <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
            </form>
            <div id="msg" class="mt-2 text-danger fw-bold"></div>
            <a href="login.html" class="d-block mt-3 text-center">Вже є акаунт? Увійти</a>
        </div>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                document.getElementById('msg').className = "mt-2 text-success fw-bold";
                document.getElementById('msg').innerText = "Успішно зареєстровано!";
                setTimeout(() => window.location.href = 'login.html', 1000);
            } else {
                document.getElementById('msg').className = "mt-2 text-danger fw-bold";
                document.getElementById('msg').innerText = result.error || "Помилка валідації (пароль мін. 10 символів)";
            }
        });
    </script>
</body>
</html>
