<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - СЕС</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card p-4 shadow">
            <h3 class="mb-3">Вхід у систему</h3>
            <form id="loginForm">
                <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
                <input type="password" id="password" class="form-control mb-3" placeholder="Пароль" required>
                <button type="submit" class="btn btn-success w-100">Увійти</button>
            </form>
            <div id="msg" class="mt-2 text-danger fw-bold"></div>
            <a href="register.html" class="d-block mt-3 text-center">Створити акаунт</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('msg').innerText = result.error || 'Невірний email або password';
            }
        });
    </script>
</body>
</html>
